<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121615">
  <title>Pokédex · UC33</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="pokedex">
    <header class="cabecalho">
      <p class="rotulo"><span class="led" aria-hidden="true"></span> UC33 / Terminal de pesquisa</p>
      <h1>Pokédex<span>.</span></h1>
      <p class="intro">Encontre um Pokémon pelo nome ou número.</p>
    </header>

    <section class="tela" aria-label="Ficha do Pokémon">
      <div class="visor">
        <img id="imagem" width="160" height="160" alt="" hidden>
        <span id="sem-imagem">Aguardando Pokémon</span>
      </div>
      <div class="identidade">
        <p id="numero" class="rotulo">#---</p>
        <h2 id="nome">Nenhum Pokémon</h2>
        <ul id="tipos" aria-label="Tipos"></ul>
      </div>
    </section>

    <p id="aviso" role="status" aria-live="polite"></p>

    <form id="busca">
      <label for="termo">Nome ou número</label>
      <div class="linha-busca">
        <input id="termo" name="termo" placeholder="Ex.: pikachu ou 25" maxlength="40" required autocomplete="off" spellcheck="false">
        <button id="buscar" type="submit">Buscar</button>
      </div>
    </form>
    <nav class="controles" aria-label="Navegação entre Pokémon">
      <button id="anterior" type="button" disabled>← Anterior</button>
      <button id="aleatorio" type="button" title="Sortear um Pokémon entre os números 1 e 151">Aleatório</button>
      <button id="proximo" type="button" disabled>Próximo →</button>
    </nav>
  </main>
</body>
</html>
